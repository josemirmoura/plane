name: Mobile web validation

on:
  pull_request:
    branches:
      - preview
      - plane-mobile-web
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-web-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-web:
    name: format, lint, types, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_OPTIONS: "--max-old-space-size=4096"
      TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha || 'origin/preview' }}
      TURBO_SCM_HEAD: ${{ github.sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.18.0"

      - name: Enable Corepack and pnpm
        run: corepack enable pnpm

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ env.STORE_PATH }}
          key: mobile-web-pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            mobile-web-pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply official formatter to affected workspaces
        run: pnpm turbo run fix:format --affected

      - name: Save formatting patch
        run: git diff --binary -- . > /tmp/mobile-oxfmt.patch

      - name: Upload formatting patch
        uses: actions/upload-artifact@v4
        with:
          name: mobile-oxfmt-patch
          path: /tmp/mobile-oxfmt.patch
          if-no-files-found: error

      - name: Lint affected workspaces
        run: pnpm turbo run check:lint --affected

      - name: Type-check affected workspaces
        run: pnpm turbo run check:types --affected

      - name: Build affected workspaces
        run: pnpm turbo run build --affected

      - name: Require committed formatting
        run: git diff --exit-code

  staging-safety-assets:
    name: staging scripts and compose isolation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Validate shell syntax
        run: bash -n scripts/mobile-staging-bootstrap-env.sh scripts/mobile-staging-preflight.sh

      - name: Install ShellCheck if needed
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y shellcheck
          fi

      - name: ShellCheck staging scripts
        run: shellcheck scripts/mobile-staging-bootstrap-env.sh scripts/mobile-staging-preflight.sh

      - name: Prepare disposable CI env files
        run: |
          cp .env.example .env
          cp apps/api/.env.example apps/api/.env
          cp apps/web/.env.example apps/web/.env
          cp apps/admin/.env.example apps/admin/.env
          cp apps/space/.env.example apps/space/.env
          cp apps/live/.env.example apps/live/.env

      - name: Validate isolated Compose config
        run: |
          docker compose \
            -p plane-mobile-test \
            -f docker-compose.yml \
            -f docker-compose.mobile-staging.yml \
            config > /tmp/plane-mobile-staging-compose.yml

          expected=(
            plane-mobile-test-web
            plane-mobile-test-admin
            plane-mobile-test-space
            plane-mobile-test-api
            plane-mobile-test-bgworker
            plane-mobile-test-beatworker
            plane-mobile-test-migrator
            plane-mobile-test-live
            plane-mobile-test-db
            plane-mobile-test-redis
            plane-mobile-test-mq
            plane-mobile-test-minio
            plane-mobile-test-proxy
          )

          for name in "${expected[@]}"; do
            grep -Fq "container_name: $name" /tmp/plane-mobile-staging-compose.yml
          done

  storybook-mobile-screenshots:
    name: Storybook mobile screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.18.0"

      - name: Enable Corepack and pnpm
        run: corepack enable pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build UI workspace dependencies
        run: pnpm turbo run build --filter=@plane/ui...

      - name: Generate UI styles
        run: pnpm --filter @plane/ui exec postcss styles/globals.css -o styles/output.css

      - name: Build UI Storybook
        run: pnpm --filter @plane/ui build-storybook

      - name: Install Chromium
        run: pnpm dlx playwright@1.55.0 install --with-deps chromium

      - name: Start Storybook static server
        run: |
          python3 -m http.server 6006 --directory packages/ui/storybook-static > /tmp/storybook.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:6006/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/storybook.log
          exit 1

      - name: Capture responsive UI screenshots
        run: |
          mkdir -p mobile-screenshots
          BREADCRUMBS_URL='http://127.0.0.1:6006/iframe.html?id=ui-breadcrumbs--default&viewMode=story'
          HEADER_URL='http://127.0.0.1:6006/iframe.html?id=ui-header--responsive-content&viewMode=story'
          pnpm dlx playwright@1.55.0 screenshot --viewport-size='360,800' --full-page "$BREADCRUMBS_URL" mobile-screenshots/breadcrumbs-360.png
          pnpm dlx playwright@1.55.0 screenshot --viewport-size='390,844' --full-page "$BREADCRUMBS_URL" mobile-screenshots/breadcrumbs-390.png
          pnpm dlx playwright@1.55.0 screenshot --viewport-size='412,915' --full-page "$BREADCRUMBS_URL" mobile-screenshots/breadcrumbs-412.png
          pnpm dlx playwright@1.55.0 screenshot --viewport-size='768,1024' --full-page "$BREADCRUMBS_URL" mobile-screenshots/breadcrumbs-768.png
          pnpm dlx playwright@1.55.0 screenshot --viewport-size='360,800' --full-page "$HEADER_URL" mobile-screenshots/header-360.png
          pnpm dlx playwright@1.55.0 screenshot --viewport-size='390,844' --full-page "$HEADER_URL" mobile-screenshots/header-390.png
          pnpm dlx playwright@1.55.0 screenshot --viewport-size='412,915' --full-page "$HEADER_URL" mobile-screenshots/header-412.png
          pnpm dlx playwright@1.55.0 screenshot --viewport-size='768,1024' --full-page "$HEADER_URL" mobile-screenshots/header-768.png

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: mobile-ui-screenshots
          path: mobile-screenshots/*.png
          if-no-files-found: error
