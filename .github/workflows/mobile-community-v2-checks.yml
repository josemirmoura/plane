name: Plane CE Mobile Web v2

on:
  push:
    branches:
      - plane-ce-mobile-web-v2
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-community-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-web:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck web and dependencies
        run: pnpm exec turbo run check:types --filter=web

      - name: Build web and dependencies
        run: pnpm exec turbo run build --filter=web
